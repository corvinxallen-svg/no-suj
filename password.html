<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password</title>
    <link rel="stylesheet" href="password.css">
    <script src="password.js" defer></script>
    <link rel="icon" href="icon.ico" type="image/svg+xml">
    <link rel="icon" href="icon.ico" sizes="any">
</head>
<body>
    <div class="container">
      
      <div class="hint-group">
        <svg class="lightbulb-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"></path>
          <path d="M9 18h6"></path>
          <path d="M10 22h4"></path>
        </svg>
        <div class="tooltip">Your Birthday</div>
      </div>

      <input required="" type="password" name="text" class="input" id="passwordInput">
      <label class="label">Password</label>
      
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon" id="togglePassword">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      
      <div id="errorMessage" class="error-text">Invalid password</div>
    </div>
</body>
</html>
