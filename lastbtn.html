<!-- lastbtn.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Sequence</title>
    <link rel="stylesheet" href="lastbtn.css">
    <script src="lastbtn.js" defer></script>
    <link rel="icon" href="icon.ico" type="image/svg+xml">
    <link rel="icon" href="icon.ico" sizes="any">
</head>
<body>

    <!-- Full‑page starfield (hidden until zoom ends) -->
    <div id="space-bg">
        <div id="fp-stars1" class="fp-star-layer"></div>
        <div id="fp-stars2" class="fp-star-layer"></div>
        <div id="fp-stars3" class="fp-star-layer"></div>
        <div id="fp-stars4" class="fp-star-layer twinkle-layer"></div>
        <div id="fp-stars5" class="fp-star-layer twinkle-layer-slow"></div>
    </div>

    <!-- Flashlight cursor (hidden until zoom finishes) -->
    <div id="flashlight"></div>

    <!-- The button -->
    <button type="button" class="btn">
        <strong>Press</strong>
        <div id="container-stars">
            <div id="stars1" class="star-layer"></div>
            <div id="stars2" class="star-layer"></div>
            <div id="stars3" class="star-layer"></div>
        </div>
        <div id="glow">
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
    </button>

    <!-- Confession content (hidden until zoom) -->
    <div id="confession-wrapper">
        <div class="confession-text" data-index="0">you might have noticed something...</div>
        <div class="confession-text" data-index="1">or maybe you haven't</div>
        <div class="confession-text" data-index="2">but there's something i need to tell you</div>
        <div class="confession-text" data-index="3">something i've held close for a while now</div>
        <div class="confession-text" data-index="4">every moment with you feels different</div>
        <div class="confession-text" data-index="5">and i can't keep pretending anymore</div>
        <div class="confession-text" data-index="6">so i'm just going to say it...</div>
        <div class="confession-text final-text" data-index="7">i'm completely, hopelessly in love with you</div>
    </div>

</body>
</html>
